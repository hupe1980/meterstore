name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This graph is DataFusion + Arrow + Iceberg + sqlx + tonic + axum, and a
      # debug build of it is tens of gigabytes of artifacts. A hosted runner has
      # ~14 GB free, and running out does not fail tidily: `rust-lld` takes a
      # **bus error** writing an output it cannot extend, which reads as a
      # linker bug rather than as a full disk. Reclaiming the preinstalled
      # toolchains this job never uses buys ~20 GB.
      - name: Free runner disk
        run: |
          before=$(df -m --output=avail / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df -m --output=avail / | tail -1)
          echo "reclaimed $(( (after - before) / 1024 )) GiB; $(( after / 1024 )) GiB free"

      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Full parallelism. The blanket `--test-threads=4` this used to carry
      # predated two changes: PostgreSQL is now one shared container per test
      # binary rather than one per test, and the only remaining per-test
      # containers — the foreign engines — are bounded directly by
      # `tests/it/containers.rs`. Capping every test to throttle a dozen of them
      # slowed the other 228 for nothing.
      - name: Test
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Two DataFusion majors in one graph give mutually incompatible
  # `TableProvider` types. This already happened once via
  # `datafusion-table-providers`, so it is a hard gate, not a lint.
  single-sourced-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No duplicate datafusion / arrow / iceberg
        run: |
          # `cargo tree -d` also lists a package twice when it is built for both
          # host and target (build-dependencies), at the *same* version. That is
          # not a conflict. Only differing versions of a single-sourced crate are.
          conflicts=$(cargo tree -d --edges normal 2>/dev/null \
            | grep -oE '^(datafusion|arrow|iceberg|parquet|metering|time|rust_decimal) v[0-9.]+' \
            | sort -u \
            | awk '{ seen[$1]++ } END { for (n in seen) if (seen[n] > 1) print n }')
          if [ -n "$conflicts" ]; then
            echo "::error::multiple versions of a single-sourced dependency: $conflicts"
            cargo tree -d --edges normal
            exit 1
          fi
          echo "single-sourced dependencies OK"


  # `--all-features` hides a broken feature combination entirely: an optional
  # dependency reached from non-optional code compiles fine as long as
  # *something* enables it. The failure only appears for someone who picked a
  # narrower set — that is, only after publishing, in someone else's build.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every feature combination a published crate's users can select
        run: |
          set -uo pipefail
          fail=0
          for set in "--no-default-features" \
                     "--no-default-features --features rest-catalog" \
                     "--no-default-features --features flight" \
                     "--no-default-features --features cli" \
                     "--no-default-features --features catalog-facade" \
                     "--no-default-features --features sql-catalog" \
                     "--no-default-features --features s3tables" \
                     "--no-default-features --features testkit" \
                     "--all-features"; do
            printf '%-56s' "$set"
            if cargo check --quiet --all-targets $set 2>/tmp/out; then
              echo ok
            else
              echo FAILED
              grep -E '^error' -A 6 /tmp/out | head -20
              fail=1
            fi
          done
          exit "$fail"

  # A declared MSRV that nothing checks is a guess. This makes it a fact.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--all-features`, because the cloud object stores are opt-in and pull the
      # credential signers. Auditing the default graph audits a graph nobody
      # deploys, and silently exempts every dependency the features add.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
