name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This graph is DataFusion + Arrow + Iceberg + sqlx + tonic + axum, and a
      # debug build of it is tens of gigabytes of artifacts. A hosted runner has
      # ~14 GB free, and running out does not fail tidily: `rust-lld` takes a
      # **bus error** writing an output it cannot extend, which reads as a
      # linker bug rather than as a full disk. Reclaiming the preinstalled
      # toolchains this job never uses buys ~20 GB.
      - name: Free runner disk
        run: |
          before=$(df -m --output=avail / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df -m --output=avail / | tail -1)
          echo "reclaimed $(( (after - before) / 1024 )) GiB; $(( after / 1024 )) GiB free"

      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Full parallelism. The blanket `--test-threads=4` this used to carry
      # predated two changes: PostgreSQL is now one shared container per test
      # binary rather than one per test, and the only remaining per-test
      # containers — the foreign engines — are bounded directly by
      # `tests/it/containers.rs`. Capping every test to throttle a dozen of them
      # slowed the other 228 for nothing.
      - name: Test
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # A support floor nobody runs is a claim. This crate's other claims are not, so
  # the whole integration suite runs against the oldest PostgreSQL the
  # documentation names as well as against the newest — the one the `check` job
  # uses by default.
  #
  # Its own job rather than a matrix dimension on `check`: the format, clippy and
  # docs steps have nothing to do with the server version, and running them twice
  # would double the slowest parts of CI to re-prove something that cannot differ.
  # A separate job runs at the same time instead, so the wall clock does not move.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The floor is **read from the code**, not repeated here. Two spellings of
      # one fact can disagree, and this pair would disagree silently: the job
      # would keep passing against whatever version this file named, while the
      # documentation claimed another.
      #
      # The integration binary only: the unit and doc tests touch no server, so
      # running them here would say nothing a second time.
      - name: Integration suite on the documented floor
        run: |
          floor=$(grep -oE 'pub const FLOOR: u32 = [0-9]+' src/testkit/postgres.rs \
                  | grep -oE '[0-9]+$')
          test -n "$floor" || { echo "::error::no FLOOR in src/testkit/postgres.rs"; exit 1; }
          echo "running the integration suite against PostgreSQL $floor"
          METERSTORE_POSTGRES_IMAGE_TAG="$floor-alpine" cargo test --all-features --test it

  # Two DataFusion majors in one graph give mutually incompatible
  # `TableProvider` types. This already happened once via
  # `datafusion-table-providers`, so it is a hard gate, not a lint.
  single-sourced-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No duplicate datafusion / arrow / iceberg
        run: |
          # `cargo tree -d` also lists a package twice when it is built for both
          # host and target (build-dependencies), at the *same* version. That is
          # not a conflict. Only differing versions of a single-sourced crate are.
          conflicts=$(cargo tree -d --edges normal 2>/dev/null \
            | grep -oE '^(datafusion|arrow|iceberg|parquet|metering|time|rust_decimal) v[0-9.]+' \
            | sort -u \
            | awk '{ seen[$1]++ } END { for (n in seen) if (seen[n] > 1) print n }')
          if [ -n "$conflicts" ]; then
            echo "::error::multiple versions of a single-sourced dependency: $conflicts"
            cargo tree -d --edges normal
            exit 1
          fi
          echo "single-sourced dependencies OK"


  # `--all-features` hides a broken feature combination entirely: an optional
  # dependency reached from non-optional code compiles fine as long as
  # *something* enables it. The failure only appears for someone who picked a
  # narrower set — that is, only after publishing, in someone else's build.
  features:
    name: features (${{ matrix.set.name }})
    runs-on: ubuntu-latest
    strategy:
      # **Every set, not the first to fail.** A broken feature combination
      # usually breaks alone, and cancelling the siblings would hide which
      # others are broken too — turning one red run into several.
      fail-fast: false
      matrix:
        set:
          - { name: none,            flags: --no-default-features }
          - { name: rest-catalog,    flags: --no-default-features --features rest-catalog }
          - { name: sql-catalog,     flags: --no-default-features --features sql-catalog }
          - { name: s3tables,        flags: --no-default-features --features s3tables }
          - { name: catalog-facade,  flags: --no-default-features --features catalog-facade }
          - { name: flight,          flags: --no-default-features --features flight }
          - { name: testkit,         flags: --no-default-features --features testkit }
          - { name: cli,             flags: --no-default-features --features cli }
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      - uses: dtolnay/rust-toolchain@stable

      # Keyed per feature set, which is the half that makes this quick. Changing
      # the feature set changes the whole resolve graph, so one shared cache is
      # a cache each set misses: the sets ran in sequence over one `target/` and
      # every one of them rebuilt DataFusion, Arrow, Iceberg and sqlx from
      # scratch. A cache per set is a cache each set hits.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.set.name }}

      # No `--all-features` entry: the `check` job already runs the whole suite
      # under it, so a tenth job here would rebuild the same graph to re-run a
      # subset of the same tests. What this job is for is the sets `--all-features`
      # *hides*.
      #
      # `test --lib`, not `check`: a feature set can compile and still be wrong.
      # The documented example names both a catalogue and an object-store
      # scheme, and validating it needs both features present — a coupling a
      # type check cannot see. Unit tests only; the integration suite needs
      # Docker and runs under `check` and `floor`.
      - name: ${{ matrix.set.flags }}
        run: cargo test --quiet --lib ${{ matrix.set.flags }}

  # A declared MSRV that nothing checks is a guess. This makes it a fact.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--all-features`, because the cloud object stores are opt-in and pull the
      # credential signers. Auditing the default graph audits a graph nobody
      # deploys, and silently exempts every dependency the features add.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
