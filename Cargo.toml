[package]
name = "meterstore"
version = "0.13.0"
edition = "2024"
authors = ["hupe1980"]
description = "Hot/cold tiered store for metering time series — PostgreSQL for the recent window, Apache Iceberg for history."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/meterstore"
homepage = "https://hupe1980.github.io/meterstore"
documentation = "https://docs.rs/meterstore"
keywords = ["metering", "iceberg", "timeseries", "postgres"]
categories = ["database", "data-structures"]
readme = "README.md"
# Set by the highest dependency floor (metering and iceberg both want
# 1.94), not by this crate's own syntax, which needs only 1.88.
rust-version = "1.94"

# The crate documentation describes Flight SQL, the façade and the testkit, none
# of which are default features.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Full debug info makes each integration test binary ~420 MB, almost all of it
# DWARF for dependencies; twenty of those exhaust a CI runner's disk and `rust-lld`
# reports it as a bus error. `line-tables-only` keeps `file:line` in a backtrace,
# which is what a failing test needs. Set `debug = true` locally to step through a
# dependency.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Compiled once, executed constantly by the integration suites. Optimising them
# alone leaves this crate unoptimised and debuggable.
opt-level = 1

[lints.rust]
# Test binaries here exceed the 16 MB of unwind tables the macOS linker encodes
# compactly. The note is about debug-info layout, not this crate's code, and there
# is nothing to act on — but `-D warnings` would fail the build locally.
linker_messages = "allow"

[dependencies]
# --- Query Engine ---
# Single-sourced: every DataFusion-dependent crate must track this same major.
# A duplicate `datafusion` in `cargo tree -d` is a build failure, not a warning:
# two majors give mutually incompatible `TableProvider` and `RecordBatch` types.
datafusion = "53.1"
async-trait = "0.1"
# The `arrow` DataFusion already pulls, declared only for the `json` feature that
# `QueryResult::to_json` needs. The duplicate gate catches any divergence.
arrow = { version = "58.4", default-features = false, features = ["json"] }

# --- Cold Tier: Apache Iceberg ---
iceberg = "0.10"
iceberg-datafusion = "0.10"
# The catalogue behind `IcebergSqlCatalog`. Optional but in `default`, so only a
# deployment that opts out notices: it reaches `sqlx`'s optional SQLite driver,
# and `libsqlite3-sys` declares `links = "sqlite3"`, which cargo enforces over the
# whole resolve graph — feature on or not. A workspace that also links an embedded
# SQLite therefore cannot resolve until this is turned off.
iceberg-catalog-sql = { version = "0.10", optional = true }
# The cloud object stores only: `file://` and `memory://` use `iceberg`'s own
# factories. Optional because `opendal-core` depends on `quick-xml`
# unconditionally and on a second `reqwest` and rustls — a whole HTTP stack a
# warehouse on local disk has no use for.
iceberg-storage-opendal = { version = "0.10", default-features = false, optional = true }
# `IcebergRestCatalog`: Polaris, Lakekeeper, Nessie, Gravitino. Default, because
# it is what `CatalogKind::Rest` selects and what every engine already speaks.
# Unrelated to `catalog-facade`, which serves the REST protocol over whatever
# catalogue is in use.
iceberg-catalog-rest = { version = "0.10", optional = true }
# AWS S3 Tables through its native API. Not the Iceberg REST endpoint, which
# authenticates with SigV4 that `iceberg-catalog-rest` cannot sign.
iceberg-catalog-s3tables = { version = "0.10", optional = true }

# --- Hot Tier: PostgreSQL ---
# The defaults (`any`, `macros`, `migrate`, `json`) are unused here — every
# statement is a runtime `sqlx::query` — and carry the optional SQLite driver.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
# Asked of the driver, not the facade: `sqlx/time` names `sqlx-sqlite?/time`, and
# naming an optional dependency is enough to put it in the resolve graph.
# Unification makes the two identical for this crate's code.
sqlx-postgres = { version = "0.8", default-features = false, features = ["time", "rust_decimal"] }

# --- Domain Layer ---
# The domain: every quantity, calendar, unit, quality flag and identifier is its
# type. This crate stores them and computes with none of them. Part of the mako
# platform (hupe1980/mako).
#
# A floor rather than a preference: `ids::{BdewCode, Eic, MaloId, MeloId}` are
# what a `check =` column parses with and what a `VersionScope` carries, and
# `wire::rfc3339` fixes the shape the `provenance` column is written in.
metering = { version = "0.23", features = ["serde"] }

# `metering`'s choice, not chrono: mixing the two would convert at every row.
# Europe/Berlin DST gives 92- and 100-interval days, which every daily aggregate
# depends on.
#
# Deliberately not `serde-human-readable`: `time`'s serde impl is
# feature-conditional, so enabling it would make the stored shape of the
# `provenance` column depend on what else is in the binary.
# `encode::encode_provenance` writes it explicitly instead.
time = { version = "0.3", features = ["macros"] }
time-tz = "2"
# Settlement is money — never f64.
rust_decimal = "1"

# --- Erasure ---
# The OS CSPRNG, not `std`'s hash seed: a guessable subject reference is a
# re-identification path that survives erasure.
getrandom = "0.4"
# Keyed hash of an erased identifier, so a replaying pipeline can be refused
# without the audit trail retaining the identifier it just erased.
hmac = "0.12"
sha2 = "0.10"
# `SubjectRegistry` is `Clone`, so every derived session holds another copy of the
# erasure key. Declared so it is wiped on drop rather than merely redacted.
zeroize = "1.9"

# --- Runtime ---
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"

# --- Optional ---
# The `cli` front end. Optional: a library consumer has no use for an argument
# parser.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"], optional = true }
# For the CLI alone. The library installs no subscriber: capturing the global one
# takes the decision away from the application embedding it.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# The default of each is `["ring"]`, which enables `rustls/ring` through `bollard`.
# Every other rustls here is `aws-lc-rs`, and two providers with neither installed
# as the process default is a `rustls` panic.
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"], optional = true }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "aws-lc-rs"], optional = true }
tempfile = { version = "3.27", optional = true }
axum = { version = "0.8", optional = true }
thiserror = "2.0.19"
tracing = "0.1.44"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
# Same major as `arrow`; the duplicate gate fails the build if they diverge.
parquet = { version = "58.4", default-features = false, features = ["arrow", "zstd", "snap"] }
async-stream = "0.3.6"
futures = "0.3.33"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
toml = "1.1"
# --- Serving: Flight SQL ---
# Same major as `arrow`. `tonic` and `prost` follow arrow-flight's own floors.
arrow-flight = { version = "58.4", features = ["flight-sql"], optional = true }
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }

[dev-dependencies]
# The planner's safety properties: `time_range` may only err by widening, and
# `split` must be exhaustive and disjoint. Both are silent when broken.
proptest = "1.11"
serde_json = "1.0.151"
tempfile = "3.27.0"
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "aws-lc-rs"] }
criterion = { version = "0.8", features = ["async_tokio"] }
# Turns a bound `TcpListener` into the connection stream tonic serves, so the
# Flight tests can take an ephemeral port instead of racing on a fixed one.
tokio-stream = { version = "0.1", features = ["net"] }
# `ServiceExt::oneshot`, so the façade's routes are exercised as HTTP without
# binding a port.
tower = { version = "0.5", features = ["util"] }
# Collects an `axum::body::Body` back into bytes in those tests.
http-body-util = "0.1"

[features]
default = ["rest-catalog", "sql-catalog"]
# Cold-tier object-store backends. `file://` and `memory://` are always available
# through `iceberg`'s own factories; these add the cloud stores, and with them
# OpenDAL, its XML parser and a second HTTP/TLS stack.
object-store-s3 = ["dep:iceberg-storage-opendal", "iceberg-storage-opendal/opendal-s3"]
object-store-gcs = ["dep:iceberg-storage-opendal", "iceberg-storage-opendal/opendal-gcs"]
object-store-azure = ["dep:iceberg-storage-opendal", "iceberg-storage-opendal/opendal-azdls"]
object-store-all = ["object-store-s3", "object-store-gcs", "object-store-azure"]
# The cold tier on an Iceberg REST catalogue — Polaris, Lakekeeper, Nessie,
# Gravitino. Default, because `CatalogKind::Rest` is what a configuration file
# that says nothing selects, and a default naming a catalogue the crate could not
# construct is a default nobody can take.
rest-catalog = ["dep:iceberg-catalog-rest"]
# The cold tier on a PostgreSQL-backed Iceberg SQL catalogue: one database to
# operate. Default; turn it off in a workspace that also links SQLite.
sql-catalog = ["dep:iceberg-catalog-sql"]
# Read-only Iceberg REST endpoint, for deployments on the SQL catalogue.
catalog-facade = ["dep:axum"]
# AWS S3 Tables as the cold-tier catalogue. The `object-store-s3` implication is
# stated rather than relied upon: a table bucket's data files are in S3 either
# way, and a catalogue that compiled but could not open one would be a trap.
s3tables = ["dep:iceberg-catalog-s3tables", "object-store-s3"]
# Arrow Flight SQL over the unified hot + cold view — the one surface an external
# client cannot assemble for itself.
flight = ["dep:arrow-flight", "dep:tonic", "dep:prost"]
# The reference suite drives a real warehouse through the SQL catalogue, so it
# names that feature rather than assuming the default set is on.
testkit = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tempfile", "sql-catalog"]
# The `meterstore` command-line tool. Off by default: a service embedding this
# should not compile an argument parser.
#
# It names both serving surfaces because `serve` is the one verb a caller cannot
# assemble from the others, and `sql-catalog` because a binary has to be able to
# open a cold tier — a library caller brings its own `Arc<dyn Catalog>`, the CLI
# has only the configuration file.
cli = ["dep:clap", "dep:tracing-subscriber", "flight", "catalog-facade", "sql-catalog"]

# `required-features` rather than a separate crate: a thin front end over the same
# public API, and a workspace member would mean a second version number.
[[bin]]
name = "meterstore"
path = "src/bin/meterstore.rs"
required-features = ["cli"]

# `cargo bench`, not `cargo test`: criterion collects samples, and the default
# harness would report nothing useful.
[[bench]]
name = "encoding"
harness = false
